name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_VERSION: "9.8.1"

jobs:
  lint:
    name: ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Run ktlint
        run: |
          curl -sSLo ktlint https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          ./ktlint --relative "**/src/**/*.kt" "**/*.kts"

  network-smoke:
    name: Live YouTube smoke test (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Depends on YouTube and the runner's network; a failure is a signal to look, not a broken build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Resolve the acceptance track
        run: gradle :source:youtube:networkSmokeTest --stacktrace

  build:
    name: Test and assemble
    # Pinned: screenshot baselines are only comparable on the image that recorded them.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Unit tests
        run: gradle test --continue --stacktrace
      - name: Screenshot tests
        # Compares against the committed baselines in app/src/test/screenshots and fails on any mismatch.
        # Refresh baselines with the "Record screenshots" workflow, review them, then commit.
        run: gradle :app:verifyRoborazziDebug --stacktrace
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: sitara-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sitara-screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
