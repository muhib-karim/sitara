name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_VERSION: "9.8.1"

jobs:
  lint:
    name: ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Run ktlint
        run: |
          curl -sSLo ktlint https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          ./ktlint --relative "**/src/**/*.kt" "**/*.kts"

  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Unit tests
        run: gradle test --stacktrace
      - name: Screenshot tests
        run: gradle :app:verifyRoborazziDebug --stacktrace || gradle :app:recordRoborazziDebug --stacktrace
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: sitara-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sitara-screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
