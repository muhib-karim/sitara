name: Record screenshots

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.8.1"
      - name: Record
        run: gradle :app:recordRoborazziDebug --stacktrace
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/screenshots
          cp app/src/test/screenshots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B screenshots/auto
          git add docs/screenshots app/src/test/screenshots
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "docs: refresh screenshots"
          git push --force-with-lease origin screenshots/auto
          gh pr create --base main --head screenshots/auto --title "docs: refresh screenshots" --body "Screenshots recorded by Roborazzi in CI." || echo "PR already open"
