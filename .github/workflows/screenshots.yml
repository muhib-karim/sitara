name: Record screenshots

# Records Roborazzi baselines on the same runner image CI verifies on.
# The images are uploaded as an artifact for review; a maintainer commits them
# to app/src/test/screenshots (baselines) and docs/screenshots (README, site).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.8.1"
      - name: Record
        run: gradle :app:recordRoborazziDebug --stacktrace
      - name: Upload baselines
        uses: actions/upload-artifact@v5
        with:
          name: sitara-screenshot-baselines
          path: app/src/test/screenshots/*.png
          if-no-files-found: error
