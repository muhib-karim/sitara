name: Device screens

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.8.1"
      - name: Check capture readiness logic
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      # The widget check runs on the minified build, signed with the debug key the debug build just created.
      - name: Assemble minified APK and the widget check
        env:
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_ALIAS: androiddebugkey
          SIGNING_KEY_PASSWORD: android
        run: |
          export SITARA_KEYSTORE_PATH="$HOME/.android/debug.keystore"
          gradle :app:assembleRelease :app:assembleReleaseAndroidTest --stacktrace
      # WorkManager (which runs the widget) needs this constructor; without it the widget never drew in 0.9.6.
      - name: R8 kept WorkManager's input merger constructor
        run: grep -A8 "^androidx.work.OverwritingInputMerger -> " app/build/outputs/mapping/release/mapping.txt | grep -q "<init>()"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture seeded screens on API 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put system font_scale 1.0
            python3 tools/capture-device-screens.py
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb install -r app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell appwidget grantbind --package app.sitara.music --user 0
            adb logcat -c
            adb shell am instrument -w app.sitara.music.test/app.sitara.music.WidgetCheckInstrumentation | tee artifacts/device-screens/widget-check.txt
            adb logcat -d -v brief > artifacts/device-screens/widget-logcat.txt || true
            adb pull /sdcard/Android/data/app.sitara.music/files/widget-placed.png artifacts/device-screens/widget-placed.png || true
            grep -q "WIDGET DRAWN" artifacts/device-screens/widget-check.txt
      - name: Upload device screenshots and hierarchy
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sitara-device-screens
          path: artifacts/device-screens/
          if-no-files-found: error
